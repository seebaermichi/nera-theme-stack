# One index per language (search-index.json, search-index.de.json), so the
# German search page finds German pages only.
group_by_lang: true
# The search page brings its own <h1> (partials/page-header.pug).
show_title: false
# The client loads through the theme's scripts-extra.pug seam, at the end of
# <body>, not from the template.
include_script: false
